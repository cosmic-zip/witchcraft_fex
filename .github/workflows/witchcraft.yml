name: Witchcraft CI/CD

"on":
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      build_release:
        description: "Compilar binário com Nuitka e gerar Release?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive bash install.sh

      - name: Run Tests
        run: |
          python3 witchcraft/witchcraft/tests/test_run.py

  build-release:
    name: Build Standalone & Release (Nuitka)
    runs-on: ubuntu-latest
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_release == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools & Nuitka
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y patchelf ccache zip build-essential
          python -m pip install --upgrade pip
          pip install nuitka zstandard

      - name: Build Standalone Binary with Nuitka
        run: |
          cd witchcraft
          python -m nuitka \
            --mode=onefile \
            --enable-plugin=anti-bloat \
            --output-dir=build \
            --output-filename=witchcraftfex \
            main.py

      - name: Bundle Standalone Binary and Spellbook
        run: |
          mkdir -p dist
          cp witchcraft/build/witchcraftfex dist/
          cp -r witchcraft/spellbook dist/
          cd dist
          zip -r ../witchcraft-standalone.zip witchcraftfex spellbook/
          cd ..
          ls -lh witchcraft-standalone.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: witchcraft-standalone
          path: witchcraft-standalone.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.0-build.{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && format('WitchcraftFEX {0}', github.ref_name) || format('WitchcraftFEX v0.1.0 (Build {0})', github.run_number) }}
          files: witchcraft-standalone.zip
          draft: false
          prerelease: false
          generate_release_notes: true
